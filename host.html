<body data-join-role="host">

<section class="join" id="join">
  <img class="join__logo" src="assets/brand/logo.png" alt="Dawg House" onerror="this.remove()">
  <div class="join__step" data-join-step="role">
    <p class="join__lead join__lead--ask">What are you here for?</p>
    <div class="join__roles">
      <button class="joinrole" type="button" data-role="player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        <b>Playing a duel</b>
        <i>You&rsquo;re the second player, answering on your own device.</i>
      </button>
      <button class="joinrole" type="button" data-role="host">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <b>Marking answers</b>
        <i>You see the answer and call it right or wrong while they film.</i>
      </button>
    </div>
  </div>

  <div class="join__step" data-join-step="code" hidden>
  <button class="join__back" type="button" id="joinBack">&larr; Not that</button>
  <span class="join__tag">MARKING</span>
  <p class="join__lead">Type the room code from the duel screen.</p>
  <form class="join__form" id="joinForm" autocomplete="off">
    <input class="join__input" id="joinCode" inputmode="latin" autocapitalize="characters"
           autocomplete="off" spellcheck="false" maxlength="6" placeholder="CODE" aria-label="Room code">
    <button class="join__go" type="submit">JOIN</button>
  </form>
  <p class="join__state" id="joinState">not connected</p>
  <p class="join__note">Keep this open next to the camera. Every button here drives the duel screen.</p>
  </div>

  <a class="join__home" href="index.html">&larr; Back to dawghouseduel.com</a>
</section>

<header class="hdr">
  <img class="hdr__logo" src="assets/brand/logo.png" alt="Dawg House" onerror="this.remove()">
  <span class="hdr__tag">HOST</span>
  <span class="hdr__room" id="hdrRoom"></span>
  <button class="hdr__leave" id="leave" title="Leave this room">&times;</button>
  <span class="hdr__cat" id="cat">—</span>
  <span class="hdr__count" id="count"></span>
</header>

<div class="clocks">
  <div class="cl" id="cl0"><b id="cl0Name">—</b><span id="cl0Clock">45.0</span><i>CONTROL</i></div>
  <div class="cl" id="cl1"><b id="cl1Name">—</b><span id="cl1Clock">45.0</span><i>CONTROL</i></div>
</div>

<main class="card">
  <div class="card__thumbwrap"><img class="card__thumb" id="thumb" alt=""></div>
  <div class="card__body">
    <p class="card__eyebrow">ON SCREEN NOW — THE ANSWER IS</p>
    <h1 class="card__answer" id="answer">—</h1>
    <p class="card__show" id="show"></p>
    <p class="card__alts" id="alts"></p>
  </div>
</main>

<div class="acts">
  <button class="act act--yes" data-cmd="correct">
    <b>CORRECT</b><i>hands control to the other dawg</i><kbd>Enter</kbd>
  </button>
  <div class="acts__row">
    <button class="act act--no" data-cmd="wrong"><b>WRONG <em id="wrongCost">−3s</em></b><i>same picture, same turn</i><kbd>X</kbd></button>
    <button class="act act--pass" data-cmd="pass"><b>PASS <em id="passCost">−2s</em></b><i>new picture, same turn</i><kbd>Space</kbd></button>
  </div>
  <div class="acts__row acts__row--minor">
    <button class="act act--ghost" data-cmd="skip"><b>SKIP PICTURE</b><kbd>S</kbd></button>
    <button class="act act--ghost" data-cmd="pause"><b id="pauseLabel">PAUSE</b><kbd>P</kbd></button>
  </div>
</div>

<footer class="foot">
  <span class="foot__next">NEXT UP: <b id="next">—</b></span>
  <span class="foot__phase" id="phase"></span>
  <span class="foot__link" id="status">not connected</span>
</footer>

<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/joinui.js"></script>
<script src="js/host.js"></script>
</body>
</html>
