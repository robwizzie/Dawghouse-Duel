name = "dawghouse-duel-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One Durable Object per room code. SQLite-backed classes are what the
# free plan allows, so keep new_sqlite_classes (not new_classes) below.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Published decks: the JSON under deck/, the pictures under img/.
# Create it once with:  npx wrangler r2 bucket create dawghouse-duel-decks
# Without this binding the deck endpoints answer 501 and the rest of the
# relay carries on working.
[[r2_buckets]]
binding = "DECKS"
bucket_name = "dawghouse-duel-decks"

[observability]
enabled = true
